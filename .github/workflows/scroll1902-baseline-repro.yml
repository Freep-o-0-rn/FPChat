name: Scroll 190.2 Baseline Race Reproduction

on:
  push:
    branches:
      - fix/190.2-scroll-restore-races
    paths:
      - '.github/workflows/scroll1902-baseline-repro.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare pre-fix audit worktree
        run: |
          git worktree add /tmp/fpchat-scroll-repro 3bd06fd942
          ln -s "${GITHUB_WORKSPACE}/node_modules" /tmp/fpchat-scroll-repro/node_modules
      - name: Reproduce three pre-fix races
        working-directory: /tmp/fpchat-scroll-repro
        run: node ./scripts/audit1902-scroll-save.cjs
