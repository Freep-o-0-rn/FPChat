name: Next Plan Item 3 Startup Waterfall

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next3-startup-waterfall.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium benchmark dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure startup waterfall
        env:
          FPCHAT_RUNTIME_SHA: 1eb7a97184a307562c51525aa358450f8346ea36
          FPCHAT_NEXT3_OUTPUT: ${{ github.workspace }}/next3-output
        run: node ./scripts/benchmark-next3-startup-waterfall.cjs
      - name: Upload startup waterfall
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next3-startup-waterfall
          path: next3-output
          if-no-files-found: error
