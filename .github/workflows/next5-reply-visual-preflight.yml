name: Next Plan Item 5 Reply Visual Preflight v2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next5-reply-visual-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove reply visual startup gate
        run: node ./scripts/benchmark-next5-reply-visual-preflight.cjs
