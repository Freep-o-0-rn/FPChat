name: Scroll 190.2 Fix Verification

on:
  push:
    branches:
      - fix/190.2-scroll-restore-races
    paths:
      - '.github/workflows/scroll1902-fix.yml'
      - 'public/app.js'
      - 'public/room-open170.js'
      - 'public/version.json'
      - 'server.js'
      - 'src/db.js'
      - 'scripts/audit1902-scroll-save.cjs'
      - 'scripts/regression1902-scroll-resilience.cjs'
      - 'scripts/regression1902-scroll-offline.cjs'
      - 'scripts/regression178-scroll-contract.cjs'
      - 'scripts/regression178-history-saved-anchor.cjs'
      - 'scripts/regression178-history-reply-pin-jump.cjs'
      - 'scripts/regression178-prepend-user-scroll.cjs'
      - 'scripts/regression178-prepend-user-scroll-browser.cjs'
      - 'scripts/regression178-history-page-owner.cjs'
      - 'scripts/regression178-gesture-layer-lifecycle.cjs'
      - 'scripts/regression178-gesture-layer-browser.cjs'
      - 'scripts/regression-next13-session-reuse.cjs'
      - 'scripts/check-build170.js'
      - 'scripts/regression178-back-scroll.cjs'
      - 'scripts/regression178-back-scroll-browser.cjs'
      - 'scripts/regression178-scroll-writer.cjs'
      - 'scripts/regression178-scroll-writer-browser.cjs'
      - 'scripts/regression178-keyboard-orientation.cjs'
      - 'scripts/regression178-keyboard-orientation-browser.cjs'
      - 'scripts/regression178-header-keyboard.cjs'
      - 'scripts/regression178-header-keyboard-browser.cjs'
      - 'scripts/regression180-single-owner-audit.cjs'
      - 'scripts/regression178-unread-restore-bottom.cjs'
      - 'scripts/regression178-unread-restore-bottom-browser.cjs'
      - 'scripts/regression-next12-client-initial-window.cjs'
      - 'scripts/regression178-bounded-dom.cjs'
      - 'scripts/regression178-read-contract.cjs'
      - 'scripts/regression178-read-visible-admission.cjs'
      - 'scripts/regression186-loading-browser.cjs'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check public/app.js
          node --check public/room-open170.js
          node --check server.js
          node --check src/db.js
          node --check scripts/audit1902-scroll-save.cjs
      - name: App revision contract
        run: npm run test:next:7
      - name: Scroll race assertions
        run: npm run audit:1902:scroll-save
      - name: Scroll resilience browser scenarios
        run: npm run test:190.2:scroll-resilience
      - name: Offline leave and recovery
        run: npm run test:190.2:scroll-offline
      - name: Initial window regression
        run: npm run test:next:12
      - name: Scroll owner contract
        run: npm run test:178:scroll-contract
      - name: Saved anchor regression
        run: npm run test:178:history-saved-anchor
      - name: Delayed history user-scroll regression
        run: npm run test:178:prepend-user-scroll
      - name: Reply and pin jump regression
        run: npm run test:178:history-reply-pin-jump
      - name: Unread and bottom browser regression
        run: npm run test:178:unread-restore-bottom
      - name: Same-session reuse regression
        run: npm run test:next:13
      - name: RoomContext regression
        run: npm run check:170
      - name: History page owner
        run: npm run test:178:history-page-owner
      - name: Gesture and scroll ownership
        run: npm run test:178:gesture-layer-lifecycle
      - name: Back scroll browser regression
        run: npm run test:178:back-scroll
      - name: Scroll writer regression
        run: npm run test:178:scroll-writer
      - name: Keyboard and orientation regression
        run: npm run test:178:keyboard-orientation
      - name: Header keyboard regression
        run: npm run test:178:header-keyboard
      - name: Bounded DOM regression
        run: npm run test:178:bounded-dom
      - name: Read visibility contract
        run: |
          npm run test:178:read-contract
          npm run test:178:read-visible-admission
      - name: Late thumbnail/layout regression
        run: npm run test:186:browser
      - name: Single-owner audit
        run: npm run test:180:single-owner-audit
