name: Item 19 Real Device Report Acceptance

on:
  push:
    branches:
      - optimization/performance-item19-real-device-report-v2
    paths:
      - '.github/workflows/item19-real-device-report.yml'
      - 'public/runtime169.js'
      - 'public/app.js'
      - 'public/room-open170.js'
      - 'public/history174.js'
      - 'public/text-send170.js'
      - 'public/reaction-manager188.js'
      - 'public/reaction-renderer188.js'
      - 'public/media-gallery134.js'
      - 'public/connection170.js'
      - 'public/sync-coordinator176.js'
      - 'public/version.json'
      - 'scripts/regression-next19-real-device-report.cjs'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check public/runtime169.js
          node --check public/app.js
          node --check public/room-open170.js
          node --check public/history174.js
          node --check public/text-send170.js
          node --check public/reaction-manager188.js
          node --check public/reaction-renderer188.js
          node --check public/media-gallery134.js
          node --check public/connection170.js
          node --check public/sync-coordinator176.js
          node --check scripts/regression-next19-real-device-report.cjs
      - name: App revision contract
        run: npm run test:next:7
      - name: Existing loading diagnostics
        run: npm run test:186:browser
      - name: Existing download report item 19
        run: npm run test:next:19
      - name: Send and same-session reuse
        run: |
          npm run test:next:2
          npm run test:177:send-manager
          npm run test:next:13
      - name: Media viewer
        run: |
          npm run test:next:15
          npm run test:177:media-viewer-lifecycle
          npm run test:186:media-cache
      - name: Reactions
        run: node ./scripts/regression1884-reaction-interaction.cjs
      - name: Connection and owners
        run: |
          npm run check:170
          npm run test:180:single-owner-audit
      - name: Scroll restore base
        run: |
          npm run test:190.2:scroll-resilience
          npm run test:190.2:scroll-offline
