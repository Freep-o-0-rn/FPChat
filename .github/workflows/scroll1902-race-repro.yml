name: Scroll 190.2 Race Reproduction

on:
  push:
    branches:
      - fix/190.2-scroll-restore-races
    paths:
      - '.github/workflows/scroll1902-race-repro.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: node --check scripts/audit1902-scroll-save.cjs
      - name: Reproduce three scroll-save races
        run: npm run audit:1902:scroll-save
