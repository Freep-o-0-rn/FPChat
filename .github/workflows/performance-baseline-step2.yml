name: Performance Baseline Step 2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/performance-baseline-step2.yml'

jobs:
  ownership-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Network compatibility owner
        run: npm run check:171
      - name: Single-owner audit
        run: npm run test:180:single-owner-audit
