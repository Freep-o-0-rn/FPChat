name: Performance Baseline Step 2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/performance-baseline-step2.yml'

jobs:
  baseline-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Network owner baseline
        run: npm run check:171 && npm run test:177:network-fetch
      - name: Single-owner baseline
        run: npm run test:180:single-owner-audit
      - name: Media baseline after owner-map cleanup
        run: npm run test:190
