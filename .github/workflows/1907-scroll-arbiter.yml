name: Build 190.7 Scroll Arbiter Acceptance

on:
  push:
    branches:
      - fix/190.7-scroll-arbiter-single-writer

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax and app revision
        run: |
          node --check public/app.js
          node --check public/viewport-fix.js
          node --check scripts/regression178-scroll-contract.cjs
          node --check scripts/regression180-single-owner-audit.cjs
          node --check scripts/regression1902-scroll-resilience.cjs
          npm run test:next:7
      - name: Scroll ownership contract
        run: |
          npm run test:178:scroll-contract
          npm run test:178:scroll-writer
          npm run test:180:single-owner-audit
      - name: Scroll interaction regressions
        run: |
          npm run test:178:back-scroll
          npm run test:178:prepend-user-scroll
          npm run test:190.2:scroll-resilience
          npm run test:190.2:scroll-offline
      - name: Diagnostics compatibility
        run: |
          npm run test:next:19
          npm run test:186:browser
