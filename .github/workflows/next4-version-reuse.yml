name: Next Plan Item 4 Version Reuse

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next4-version-reuse.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Item 4 regression
        run: npm run test:next:4
      - name: Existing startup regression
        run: npm run test:186:startup
      - name: Existing system push regression
        run: npm run test:189:system-push
      - name: Corrected startup waterfall after change
        env:
          FPCHAT_RUNTIME_SHA: 63664e5c013cfb44bda7f179b383a6460fd595d2
          FPCHAT_NEXT3_OUTPUT: ${{ github.workspace }}/next4-output
        run: node ./scripts/benchmark-next3-startup-waterfall.cjs
      - name: Upload item 4 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next4-version-reuse
          path: next4-output
          if-no-files-found: warn
