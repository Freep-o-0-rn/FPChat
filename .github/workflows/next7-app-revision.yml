name: Next Plan Item 7 App Revision

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next7-app-revision.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Item 7 regression
        run: npm run test:next:7
      - name: Existing version reuse regression
        run: npm run test:next:4
      - name: Existing startup regression
        run: npm run test:186:startup
      - name: Existing rollback contract
        run: npm run test:180:rollback-contract
