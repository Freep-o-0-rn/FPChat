name: Scroll 190.2 Controlled Benchmark

on:
  push:
    branches:
      - fix/190.2-scroll-restore-races
    paths:
      - '.github/workflows/scroll1902-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare optimization baseline
        run: |
          git worktree add /tmp/fpchat-scroll-before 1e06e79d95f1ed87a7b605b659929c39bfc36127
          ln -s "${GITHUB_WORKSPACE}/node_modules" /tmp/fpchat-scroll-before/node_modules
      - name: Measure before
        env:
          FPCHAT_TEST_ROOT: /tmp/fpchat-scroll-before
          FPCHAT_SCROLL_BENCH_LABEL: before
          FPCHAT_SCROLL_BENCH_OUTPUT: ${{ github.workspace }}/scroll1902-benchmark
        run: node ./scripts/benchmark1902-scroll-persistence.cjs
      - name: Measure current
        env:
          FPCHAT_TEST_ROOT: ${{ github.workspace }}
          FPCHAT_SCROLL_BENCH_LABEL: current
          FPCHAT_SCROLL_BENCH_OUTPUT: ${{ github.workspace }}/scroll1902-benchmark
        run: node ./scripts/benchmark1902-scroll-persistence.cjs
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll1902-controlled-benchmark
          path: scroll1902-benchmark
          if-no-files-found: warn
