name: Performance Observer Step 3

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/performance-observer-step3.yml'

jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Runtime static baseline
        run: npm run check:169
      - name: Loading observer regression
        run: npm run test:186:browser
      - name: Current media/build regression
        run: npm run test:190
