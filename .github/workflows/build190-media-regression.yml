name: Build 190 Media Regression

on:
  workflow_dispatch:
  push:
    branches:
      - build/190-media-swipe-preview
    paths:
      - 'public/app.js'
      - 'public/media-gallery134.js'
      - 'public/media-gallery134.css'
      - 'public/media-send170.js'
      - 'public/network171.js'
      - 'server.js'
      - 'package.json'
      - 'scripts/regression190-media-*.cjs'
      - 'docs/Build190_MediaSwipePreview.md'
      - '.github/workflows/build190-media-regression.yml'

jobs:
  media-190:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build 190 owner, media and browser acceptance
        run: npm run test:190
