name: Next Plan Item 9 Static Compression Preflight v2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next9-static-compression.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure compression slow baseline
        env:
          FPCHAT_NEXT9_SLOW: '1'
          FPCHAT_NEXT9_OUTPUT: ${{ github.workspace }}/next9-output-slow
        run: node ./scripts/benchmark-next9-static-compression.cjs
      - name: Upload preflight
        uses: actions/upload-artifact@v4
        with:
          name: next9-static-compression-preflight-slow
          path: next9-output-slow
