name: Next Plan Item 12 Client Initial Window v2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next12-client-initial-window.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check public/room-open170.js
          node --check public/app.js
          node --check public/history174.js
          node --check scripts/regression-next12-client-initial-window.cjs
          node --check scripts/benchmark-next12-initial-window.cjs
      - name: App revision contract
        run: npm run test:next:7
      - name: Item 12 client integration
        run: npm run test:next:12
      - name: Item 11 server contract
        run: npm run test:next:11
      - name: Room context regression
        run: npm run check:170
      - name: History page owner
        run: npm run test:178:history-page-owner
      - name: Saved anchor
        run: npm run test:178:history-saved-anchor
      - name: Unread restore
        run: npm run test:178:unread-restore-bottom
      - name: Single-owner audit
        run: npm run test:180:single-owner-audit
      - name: Measure item 12 slow profile
        env:
          FPCHAT_RUNTIME_SHA: 3cf04a31e45998bd2e7318b6c4dc9c980dff5316
          FPCHAT_NEXT10_OUTPUT: ${{ github.workspace }}/next12-output
        run: npm run bench:next:12
      - name: Upload item 12 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next12-initial-window
          path: next12-output
          if-no-files-found: warn
