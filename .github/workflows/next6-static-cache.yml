name: Next Plan Item 6 Static Cache

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next6-static-cache.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure repeat static cache behavior
        env:
          FPCHAT_RUNTIME_SHA: b75d01761706280cfc1e04d253739d32160c2ad2
          FPCHAT_NEXT6_OUTPUT: ${{ github.workspace }}/next6-output
        run: node ./scripts/benchmark-next6-static-cache.cjs
      - name: Upload item 6 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next6-static-cache
          path: next6-output
          if-no-files-found: error
