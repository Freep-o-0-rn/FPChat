name: Next Plan Item 2 Draft Release

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next2-draft-release.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Item 2 regression
        run: npm run test:next:2
      - name: Existing text dispatch
        run: npm run test:177:text-dispatch
      - name: Existing draft save
        run: npm run test:177:composer-draft-save
      - name: Existing draft restore
        run: npm run test:177:composer-draft-restore
      - name: Send entry contract
        run: npm run test:177:send-entry-contract
