name: Next Plan Item 14 Representative Photo Cache

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next14-photo-cache.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: node --check scripts/benchmark-next14-photo-cache.cjs
      - name: Existing media cache regression
        run: npm run test:186:media-cache
      - name: Viewer lifecycle regression
        run: npm run test:177:media-viewer-lifecycle
      - name: Photo zoom regression
        run: npm run test:185:browser
      - name: Build 190 media browser regression
        run: npm run test:190:browser
      - name: Measure representative photo cache states
        env:
          FPCHAT_RUNTIME_SHA: 43d05dbffe20f2bff779f9683aaf194b3f4e0cd2
          FPCHAT_NEXT14_OUTPUT: ${{ github.workspace }}/next14-output
        run: npm run bench:next:14
      - name: Upload item 14 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next14-representative-photo-cache
          path: next14-output
          if-no-files-found: warn
