name: Step 2.2 Ownership Recheck v2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/step22-ownership-recheck.yml'

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Single-owner audit
        run: npm run test:180:single-owner-audit
      - name: Block contract
        run: npm run test:180:block-contract
      - name: Block owner bypass
        run: npm run test:180:block-owner-bypass
      - name: Presence privacy compatibility
        run: npm run test:187:presence-privacy
      - name: Network compatibility owner
        run: npm run check:171
