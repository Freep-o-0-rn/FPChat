name: Build 190.5 Longpress Hotfix Acceptance

on:
  push:
    branches:
      - fix/190.5-longpress-context-lifecycle

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium harness dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check public/message-context.js
          node --check scripts/regression178-overlay-release.cjs
          node --check scripts/regression178-message-gesture-browser.cjs
      - name: Static context lifecycle contract
        run: node ./scripts/regression178-overlay-release.cjs
      - name: Message gesture arbitration
        run: |
          node ./scripts/regression178-message-gesture-arbitration.cjs
          node ./scripts/regression178-message-gesture-browser.cjs
      - name: Existing reaction interaction
        run: node ./scripts/regression1884-reaction-interaction.cjs
      - name: Scroll restore base
        run: |
          npm run test:190.2:scroll-resilience
          npm run test:190.2:scroll-offline
      - name: Item 19 diagnostics
        run: |
          npm run test:next:19
          npm run test:186:browser
