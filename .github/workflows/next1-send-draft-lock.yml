name: Next Plan Item 1 Repeated Send Lock

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next1-send-draft-lock.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduce repeated-send draft lock
        run: npm run test:next:1
      - name: Existing text dispatch regression
        run: npm run test:177:text-dispatch
