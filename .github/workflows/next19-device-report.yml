name: Next Plan Item 19 Real Device Report

on:
  push:
    branches:
      - optimization/performance-item19-device-report
    paths:
      - '.github/workflows/next19-device-report.yml'
      - 'public/runtime169.js'
      - 'public/index.html'
      - 'public/app.js'
      - 'public/text-send170.js'
      - 'public/room-open170.js'
      - 'public/history174.js'
      - 'public/media-gallery134.js'
      - 'public/reaction-manager188.js'
      - 'public/reaction-renderer188.js'
      - 'public/connection170.js'
      - 'public/version.json'
      - 'scripts/regression-next19-device-report.cjs'
      - 'scripts/regression-next2-send-draft-release.cjs'
      - 'package.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check public/runtime169.js
          node --check public/app.js
          node --check public/text-send170.js
          node --check public/room-open170.js
          node --check public/history174.js
          node --check public/media-gallery134.js
          node --check public/reaction-manager188.js
          node --check public/reaction-renderer188.js
          node --check public/connection170.js
          node --check scripts/regression-next19-device-report.cjs
      - name: Existing loading diagnostics
        run: npm run test:186:browser
      - name: Progressive photo regression
        run: npm run test:next:15
      - name: Send owners
        run: |
          npm run test:next:2
          npm run test:177:send-manager
          npm run test:178:message-render-owner
      - name: Reaction interaction
        run: node ./scripts/regression1884-reaction-interaction.cjs
      - name: Scroll fix regressions
        run: |
          npm run test:190.2:scroll-resilience
          npm run test:190.2:scroll-offline
      - name: Connection and ownership
        run: |
          npm run check:170
          npm run test:180:single-owner-audit
      - name: Item 19 export regression
        run: npm run test:next:19
