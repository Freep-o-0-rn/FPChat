name: Next Plan Item 3.1 SW Network Coverage v2

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next31-sw-network-coverage.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium benchmark dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe SW network coverage
        env:
          FPCHAT_RUNTIME_SHA: 1eb7a97184a307562c51525aa358450f8346ea36
          FPCHAT_NEXT31_OUTPUT: ${{ github.workspace }}/next31-output
        run: node ./scripts/benchmark-next31-sw-network-coverage.cjs
      - name: Repeat corrected startup waterfall
        env:
          FPCHAT_RUNTIME_SHA: 1eb7a97184a307562c51525aa358450f8346ea36
          FPCHAT_NEXT3_OUTPUT: ${{ github.workspace }}/next31-corrected-output
        run: node ./scripts/benchmark-next3-startup-waterfall.cjs
      - name: Upload item 3.1 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next31-corrected-startup
          path: |
            next31-output
            next31-corrected-output
          if-no-files-found: error
