name: Next Plan Item 3.1 SW Network Coverage

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next31-sw-network-coverage.yml'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium benchmark dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe SW network coverage
        env:
          FPCHAT_RUNTIME_SHA: 9cabd744ca63e0160a0298a90b08edb270214031
          FPCHAT_NEXT31_OUTPUT: ${{ github.workspace }}/next31-output
        run: node ./scripts/benchmark-next31-sw-network-coverage.cjs
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next31-sw-network-coverage
          path: next31-output
          if-no-files-found: error
