name: Next Plan Item 11 Initial Window

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next11-initial-window.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax check server
        run: node --check server.js
      - name: Item 11 initial-window regression
        run: npm run test:next:11
      - name: History read owner
        run: npm run test:179:history-read-owner
      - name: History DB read path
        run: npm run test:179:history-db-read-path
      - name: Saved-anchor regression
        run: npm run test:178:history-saved-anchor
      - name: Unread restore regression
        run: npm run test:178:unread-restore-bottom
      - name: Single-owner audit
        run: npm run test:180:single-owner-audit
