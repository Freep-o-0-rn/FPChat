name: Build 180 Full Regression

on:
  workflow_dispatch:
  push:
    branches:
      - build/180-development
    paths:
      - 'public/**'
      - 'src/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/build180-full-regression.yml'

jobs:
  cumulative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install browser regression dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full accumulated regression gate
        run: node ./scripts/run18012-cumulative.cjs

  windows-180-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Full Build 180 accumulated Windows acceptance
        shell: powershell
        run: npm run test:180:1811

  last-transfer-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revert and restore last runtime transfer in isolated worktree
        run: npm run test:180:last-transfer-rollback
