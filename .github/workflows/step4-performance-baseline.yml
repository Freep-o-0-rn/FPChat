name: Step 4 Performance Baseline v4

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/step4-performance-baseline.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium benchmark dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Step 4 baseline
        env:
          FPCHAT_RUNTIME_BASE_SHA: 1c1e0453416203f6c916f214dae36bd1186f0047
          FPCHAT_STEP4_OUTPUT: ${{ github.workspace }}/step4-output
        run: node ./scripts/benchmark-step4.cjs
      - name: Upload Step 4 baseline files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-performance-baseline
          path: step4-output
          if-no-files-found: error
