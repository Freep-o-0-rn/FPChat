name: Next Plan Item 17 Send Reaction Metrics

on:
  push:
    branches:
      - optimization/performance-series
    paths:
      - '.github/workflows/next17-send-reaction.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        run: node --check scripts/benchmark-next17-send-reaction.cjs
      - name: Send owner regression
        run: npm run test:177:send-manager
      - name: Message render owner regression
        run: npm run test:178:message-render-owner
      - name: Reaction interaction regression
        run: node ./scripts/regression1884-reaction-interaction.cjs
      - name: Measure send and reaction stages
        env:
          FPCHAT_RUNTIME_SHA: 2bf734e918dfb7e31d14d574d52a7d3256076000
          FPCHAT_NEXT17_OUTPUT: ${{ github.workspace }}/next17-output
        run: npm run bench:next:17
      - name: Upload item 17 measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next17-send-reaction
          path: next17-output
          if-no-files-found: warn
