<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>FPChat</title>

  <meta name="theme-color" content="#7b2cff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FPChat" />

  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180x180.png">
  <link rel="manifest" href="/manifest.webmanifest" />
    <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e1621;
    }

    .hidden-boot {
      display: none !important;
    }

    #bootSplash,
    #bootHold152 {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(123,44,255,.24), transparent 36%),
        #0e1621;
      color: #e7edf4;
      font-family: Segoe UI, Arial, sans-serif;
      padding: 24px;
    }

    #bootHold152 {
      position: fixed;
      inset: 0;
      z-index: 100000;
      min-height: 100dvh;
      box-sizing: border-box;
    }

    .boot-card {
      width: min(360px, 100%);
      text-align: center;
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
    }

    .boot-logo {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .boot-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .boot-text {
      color: #95a3b3;
      font-size: 14px;
    }

    .boot-progress {
      position: relative;
      height: 8px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
    }

    .boot-progress-bar {
      position: absolute;
      top: 0;
      left: -45%;
      height: 100%;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #7b2cff, #39d98a, transparent);
      animation: boot-progress 1.15s ease-in-out infinite;
    }

    @keyframes boot-progress {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="bootSplash">
    <div class="boot-card">
      <div class="boot-logo">FPChat</div>
      <div id="bootTitle" class="boot-title">Загрузка FPChat...</div>
      <div id="bootText" class="boot-text">Подготавливаем приложение</div>
      <div class="boot-progress">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="app hidden-boot" id="appRoot" data-pane="list">
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close mobile-only" id="sidebarCloseBtn" aria-label="Закрыть меню">×</button>
      <button class="nav-btn active" data-view="chats"><span>💬</span><small>Чаты</small></button>
      <button class="nav-btn" data-view="create"><span>➕</span><small>Создать</small></button>
      <button class="nav-btn" data-view="join"><span>🔗</span><small>Присоединиться</small></button>
      <button class="nav-btn" data-view="restore"><span>🔑</span><small>Восстановить</small></button>
      <button class="nav-btn" data-view="settings"><span>⚙</span><small>Настройки</small></button>
    </aside>

    <section class="chat-list" id="chatListPane">
      <div class="chat-list-top">
        <button id="mobileMenuBtn" class="mobile-only btn btn-icon">☰</button>
        <input id="chatSearch" placeholder="Поиск" />
      </div>

      <div id="emptyChats" class="empty-state">
        <div class="empty-state-card">
          <h3>У вас пока нет чатов</h3>
          <p>Создайте новый чат, подключитесь по invite-ссылке или восстановите доступ по recovery-коду.</p>
          <div class="empty-state-actions">
            <button id="emptyCreateBtn" class="btn btn-primary">Создать чат</button>
            <button id="emptyJoinBtn" class="btn btn-secondary">Присоединиться по ссылке</button>
            <button id="emptyRestoreBtn" class="btn btn-secondary">Восстановить по коду</button>
          </div>
        </div>
      </div>

      <div id="chatRows"></div>
    </section>

    <main class="content" id="contentPane"></main>
  </div>

  <div id="contextMenu" class="context-menu hidden"></div>

  <script>
    (async () => {
      // Build 153: keep the Build 152 readiness gate, and mirror the original
      // boot status into it so the existing app update screen stays visible.
      const sourceSplash = document.getElementById('bootSplash');
      let bootStatusObserver = null;
      if (sourceSplash && !document.getElementById('bootHold152')) {
        const hold = sourceSplash.cloneNode(true);
        hold.id = 'bootHold152';
        hold.setAttribute('aria-hidden', 'true');
        hold.querySelector('#bootTitle')?.removeAttribute('id');
        hold.querySelector('#bootText')?.removeAttribute('id');

        const sourceTitle = sourceSplash.querySelector('#bootTitle');
        const sourceText = sourceSplash.querySelector('#bootText');
        const holdTitle = hold.querySelector('.boot-title');
        const holdText = hold.querySelector('.boot-text');
        const syncBootStatus = () => {
          if (sourceTitle && holdTitle) holdTitle.textContent = sourceTitle.textContent || '';
          if (sourceText && holdText) holdText.textContent = sourceText.textContent || '';
        };
        syncBootStatus();
        bootStatusObserver = new MutationObserver(syncBootStatus);
        if (sourceTitle) bootStatusObserver.observe(sourceTitle, { childList: true, subtree: true, characterData: true });
        if (sourceText) bootStatusObserver.observe(sourceText, { childList: true, subtree: true, characterData: true });

        document.body.appendChild(hold);
      }

      // Track only resources dynamically appended during the existing startup
      // chain. boot-ready152 checks zero pending again after two frames.
      const bootPending = new Set();
      const bootTracked = new WeakSet();
      const bootErrors = [];
      // Build 186.4: bounded diagnostics of this loader's existing JS/CSS.
      // No URLs, query strings, user identifiers or arbitrary filenames exported.
      const bootAssetNames186 = new Set('app.js boot-ready152.js build165-ui.js chat-fix.css chat-fix.js chat-opening129.js chat-request-actions146.js chat-request-cooldown160.js chat-request-owner147.js chat-request-system147.js connection170.js dom-lifecycle173.js gesture-manager135.js global-search156.js history174.js layer-manager173.js lifecycle170.js media-gallery134.css media-gallery134.js media-send170.js message-actions.css message-actions.js message-context-fix.css message-context-fix.js message-context.css message-context.js message-pins-screen114.css message-pins-screen114.js message-pins-screen115.css message-pins-screen115.js message-pins.css message-pins.js message-selection.css message-selection.js message-store172.js network171.js notification-manager181.js reply-swipe-visual184.css reply-swipe-visual184.js room-context170.js room-lifecycle.css room-lifecycle.js room-menu-touch151.js room-open170.js runtime169.js send-manager177.js settings-fix.js settings-ui131.css settings-ui131.js storage167-cache-fix.js storage167-clear-guard.js storage167.js storage168.js styles.css sw.js swipe-fix.js sync-coordinator176.js system-chat144.js system-ui148.js text-send170.js typing.css typing.js ui-hotfix128.js user-blocks165.js username-profile140.js username-search143.js viewport-fix.js viewport-layout136.js voice-cancel125.js voice-pins127.css voice-pins127.js voice-polish123.css voice-polish123.js voice.css voice.js work174.js reaction-arbiter188.js reaction-manager188.js reaction-renderer188.js reaction-picker188.js reaction-details188.js reaction-interaction188.js'.split(' '));
      const bootAssetLimit186 = 160, bootAssets186 = [];
      let bootAssetsDropped186 = 0, bootAssetsStoppedAt186 = null;
      const bootRound186 = value => Math.round(value * 10) / 10;
      function assetName186(element, isScript) {
        try {
          const url = new URL(isScript ? element.src : element.href, location.href);
          const name = url.pathname.slice(1);
          return url.origin === location.origin && bootAssetNames186.has(name) ? name : 'other';
        } catch { return 'other'; }
      }
      const bootTimings186 = { 'loader-start': performance.now() };
      const bootChecks186 = {};
      const bootPhases186 = new Set(['version-start','version-ready','version-error','owners-ready','service-worker-start','service-worker-ready','update-start','update-ready','core-ready','core-wait-start','core-wait-end','layers-start','layers-end','system-start','system-end','requests-start','requests-end','quiet-start','quiet-end','assets-start','assets-end','boot-ready','safety-release']);
      const bootObserver = new MutationObserver((records) => {
        for (const record of records) {
          for (const node of record.addedNodes || []) trackBootResources(node);
        }
      });

      function trackBootResource(element) {
        if (!(element instanceof Element) || bootTracked.has(element)) return;
        const isScript = element.matches('script[src]');
        const isStyle = element.matches('link[rel="stylesheet"][href]');
        if (!isScript && !isStyle) return;
        bootTracked.add(element);
        bootPending.add(element);
        let asset186 = null;
        if (bootAssetsStoppedAt186 === null) {
          if (bootAssets186.length < bootAssetLimit186) {
            asset186 = {name:assetName186(element, isScript), kind:isScript ? 'js' : 'css',
              startMs:bootRound186(performance.now()), endMs:null, status:'pending',
              pendingAtAssetsStart:bootTimings186['assets-start'] !== undefined};
            bootAssets186.push(asset186);
          } else bootAssetsDropped186++;
        }
        let settled = false;
        const finish = (failed) => {
          if (settled) return;
          settled = true;
          bootPending.delete(element);
          if (asset186 && bootAssetsStoppedAt186 === null) {
            asset186.endMs = bootRound186(performance.now());
            asset186.status = failed ? 'error' : 'loaded';
          }
          if (failed) bootErrors.push(isScript ? element.src : element.href);
        };
        element.addEventListener('load', () => finish(false), { once: true });
        element.addEventListener('error', () => finish(true), { once: true });
      }

      function trackBootResources(node) {
        if (!(node instanceof Element)) return;
        trackBootResource(node);
        node.querySelectorAll?.('script[src],link[rel="stylesheet"][href]').forEach(trackBootResource);
      }

      bootObserver.observe(document.documentElement, { childList: true, subtree: true });
      window.FPBoot152 = Object.freeze({
        mark186: (name, completed) => {
          if (!bootPhases186.has(name) || bootTimings186[name] !== undefined) return;
          bootTimings186[name] = performance.now();
          if (name === 'assets-start') {
            for (const asset of bootAssets186) if (asset.status === 'pending') asset.pendingAtAssetsStart = true;
          }
          if (typeof completed === 'boolean') bootChecks186[name] = completed;
        },
        timings186: () => ({points:Object.fromEntries(Object.entries(bootTimings186).map(([name, value]) => [name, Math.round(value * 10) / 10])), completed:{...bootChecks186}, assets:{limit:bootAssetLimit186, dropped:bootAssetsDropped186, stoppedAtMs:bootAssetsStoppedAt186, records:bootAssets186.map(asset => ({...asset}))}}),
        pendingCount: () => bootPending.size,
        errors: () => [...bootErrors],
        stop: () => {
          if (bootAssetsStoppedAt186 === null) bootAssetsStoppedAt186 = bootRound186(performance.now());
          bootObserver.disconnect();
          bootStatusObserver?.disconnect();
        }
      });

      // A failed optional asset must never leave FPChat permanently blocked.
      // Normal startup releases much earlier through boot-ready152.js.
      setTimeout(() => {
        const gate = document.getElementById('bootHold152');
        const root = document.getElementById('appRoot');
        if (gate && root && !root.classList.contains('hidden-boot')) {
          window.FPBoot152.mark186('safety-release');
          window.FPBoot152.stop();
          gate.remove();
          console.warn('[FPChat] Build 153 boot gate released by safety timeout.');
        }
      }, 15000);

      let buildSuffix = '';
      let reactionBuildSuffix188 = '';
      try {
        window.FPBoot152.mark186('version-start');
        const res = await fetch('/version.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const buildId = String(data?.build ?? '').trim();
          if (/^\d+(?:\.\d+)*$/.test(buildId)) {
            buildSuffix = `?v=${encodeURIComponent(buildId)}`;
          }
          const reactionRevision = String(data?.updatedAt ?? '').trim();
          if (reactionRevision) {
            reactionBuildSuffix188 = buildSuffix
              ? `${buildSuffix}&r=${encodeURIComponent(reactionRevision)}`
              : `?r=${encodeURIComponent(reactionRevision)}`;
          }
        }
        window.FPBoot152.mark186('version-ready',res.ok);
      } catch { window.FPBoot152.mark186('version-error'); }

      // Preload fetches early, but never executes scripts out of dependency order.
      // Edges below document the existing execution chains and the room-entry gate.
      const startupDependencies174 = {
        'app.js':['room-context170.js','lifecycle170.js','network171.js','message-store172.js','dom-lifecycle173.js','layer-manager173.js','work174.js','history174.js'],
        'notification-manager181.js':['app.js'],
        'voice.js':['app.js','typing.js'],
        'voice-polish123.js':['voice.js'],
        'message-context.js':['app.js','message-selection.js'],
        'message-context-fix.js':['message-context.js'],
        'message-actions.js':['message-context-fix.js'],
        'message-pins.js':['message-actions.js'],
        'message-pins-screen114.js':['message-pins.js'],
        'settings-fix.js':['app.js','notification-manager181.js'],
        'room-lifecycle.js':['app.js','notification-manager181.js','settings-fix.js'],
        'sync-coordinator176.js':['app.js','connection170.js'],
        'room-open170.js':['room-lifecycle.js','room-context170.js','lifecycle170.js','connection170.js','sync-coordinator176.js'],
        'send-manager177.js':['room-open170.js'],
        'text-send170.js':['send-manager177.js'],
        'media-send170.js':['text-send170.js']
      };
      const preload174 = ['room-context170.js','lifecycle170.js','network171.js','message-store172.js','dom-lifecycle173.js','layer-manager173.js','work174.js','history174.js','app.js','notification-manager181.js','settings-fix.js','room-lifecycle.js'];
      let resolveOwners174;
      const ownersReady174=new Promise(resolve=>{resolveOwners174=resolve;});
      window.addEventListener('fpchat:send-owners-ready174',()=>resolveOwners174(true),{once:true});
      window.FPStartup174=Object.freeze({dependencies:startupDependencies174,preloaded:preload174,ready:ownersReady174,fail:()=>resolveOwners174(false),execution:'definitions before app; navigation after room/open/send owners'});

      // Build 188: reaction owners are feature-only and load after boot-ready so
      // reactions never extend the stable Build 187 critical startup path.
      const loadReactionInteraction188 = () => {
        if (window.FPReactionInteractionManager188 || document.querySelector('script[data-fp-reaction-interaction188]')) return;
        const interaction = document.createElement('script');
        interaction.src = `/reaction-interaction188.js${reactionBuildSuffix188 || buildSuffix}`;
        interaction.dataset.fpReactionInteraction188 = '1';
        interaction.async = true;
        document.body.appendChild(interaction);
      };
      const loadReactionDetails188 = () => {
        if (window.FPReactionDetails188) { loadReactionInteraction188(); return; }
        if (document.querySelector('script[data-fp-reaction-details188]')) return;
        const details = document.createElement('script');
        details.src = `/reaction-details188.js${reactionBuildSuffix188 || buildSuffix}`;
        details.dataset.fpReactionDetails188 = '1';
        details.async = true;
        details.onload = loadReactionInteraction188;
        // Details is optional. Interaction keeps the Build 188.4 context fallback.
        details.onerror = loadReactionInteraction188;
        document.body.appendChild(details);
      };
      const loadReactionPicker188 = () => {
        if (window.FPReactionPicker188) { loadReactionDetails188(); return; }
        if (document.querySelector('script[data-fp-reaction-picker188]')) return;
        const picker = document.createElement('script');
        picker.src = `/reaction-picker188.js${reactionBuildSuffix188 || buildSuffix}`;
        picker.dataset.fpReactionPicker188 = '1';
        picker.async = true;
        picker.onload = loadReactionDetails188;
        // Picker is optional. Details/quick reactions still load without it.
        picker.onerror = loadReactionDetails188;
        document.body.appendChild(picker);
      };
      const loadReactionRenderer188 = () => {
        if (window.FPReactionRenderer188) { loadReactionPicker188(); return; }
        if (document.querySelector('script[data-fp-reaction-renderer188]')) return;
        const renderer = document.createElement('script');
        renderer.src = `/reaction-renderer188.js${reactionBuildSuffix188 || buildSuffix}`;
        renderer.dataset.fpReactionRenderer188 = '1';
        renderer.async = true;
        renderer.onload = loadReactionPicker188;
        document.body.appendChild(renderer);
      };
      const loadReactionFoundation188 = () => {
        if (window.FPReactionManager188) { loadReactionRenderer188(); return; }
        if (document.querySelector('script[data-fp-reaction-manager188]')) return;
        const arbiter = document.createElement('script');
        arbiter.src = `/reaction-arbiter188.js${reactionBuildSuffix188 || buildSuffix}`;
        arbiter.dataset.fpReactionArbiter188 = '1';
        arbiter.async = true;
        arbiter.onload = () => {
          if (window.FPReactionManager188) { loadReactionRenderer188(); return; }
          if (document.querySelector('script[data-fp-reaction-manager188]')) return;
          const manager = document.createElement('script');
          manager.src = `/reaction-manager188.js${reactionBuildSuffix188 || buildSuffix}`;
          manager.dataset.fpReactionManager188 = '1';
          manager.async = true;
          manager.onload = loadReactionRenderer188;
          document.body.appendChild(manager);
        };
        document.body.appendChild(arbiter);
      };
      window.addEventListener('fpchat:boot-ready', loadReactionFoundation188, { once: true, passive: true });

      // Build 186.5: fetch the storage tail after critical owners are ready.
      // Hints do not execute code. build165-ui keeps its storage -> clear guard
      // -> cache fix -> accounting onload chain, including existing failures.
      ownersReady174.then(ready => {
        if (!ready) return;
        for (const name of ['storage167.js','storage167-clear-guard.js','storage167-cache-fix.js','storage168.js']) {
          const hint = document.createElement('link');
          hint.rel = 'preload'; hint.as = 'script'; hint.href = `/${name}${buildSuffix}`;
          hint.fetchPriority = 'low';
          document.head.appendChild(hint);
        }
      });

      // Fetch the optional visual in parallel with the existing owner chain.
      // A failed visual asset keeps the old reply indicator functional.
      const replyVisualScriptReady184 = new Promise(resolve => {
        const visual = document.createElement('script');
        visual.src = `/reply-swipe-visual184.js${buildSuffix}`;
        visual.onload = () => resolve(true);
        visual.onerror = () => resolve(false);
        document.body.appendChild(visual);
      });
      const replyVisualStyleReady184 = new Promise(resolve => {
        const css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = `/reply-swipe-visual184.css${buildSuffix}`;
        css.onload = () => resolve(true);
        css.onerror = () => resolve(false);
        document.head.appendChild(css);
      });
      const replyVisualReady184 = Promise.all([replyVisualScriptReady184, replyVisualStyleReady184]).then(loaded => {
        if (loaded.includes(false)) window.FPReplySwipeVisual184 = null;
      });

      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = `/styles.css${buildSuffix}`;
      document.head.appendChild(css);

      const chatFixCss = document.createElement('link');
      chatFixCss.rel = 'stylesheet';
      chatFixCss.href = `/chat-fix.css${buildSuffix}`;
      document.head.appendChild(chatFixCss);

      const messageContextCss = document.createElement('link');
      messageContextCss.rel = 'stylesheet';
      messageContextCss.href = `/message-context.css${buildSuffix}`;
      document.head.appendChild(messageContextCss);

      const messageContextFixCss = document.createElement('link');
      messageContextFixCss.rel = 'stylesheet';
      messageContextFixCss.href = `/message-context-fix.css${buildSuffix}`;
      document.head.appendChild(messageContextFixCss);

      const messageActionsCss = document.createElement('link');
      messageActionsCss.rel = 'stylesheet';
      messageActionsCss.href = `/message-actions.css${buildSuffix}`;
      document.head.appendChild(messageActionsCss);

      const messageSelectionCss = document.createElement('link');
      messageSelectionCss.rel = 'stylesheet';
      messageSelectionCss.href = `/message-selection.css${buildSuffix}`;
      document.head.appendChild(messageSelectionCss);

      const messagePinsCss = document.createElement('link');
      messagePinsCss.rel = 'stylesheet';
      messagePinsCss.href = `/message-pins.css${buildSuffix}`;
      document.head.appendChild(messagePinsCss);

      const messagePins114Css = document.createElement('link');
      messagePins114Css.rel = 'stylesheet';
      messagePins114Css.href = `/message-pins-screen114.css${buildSuffix}`;
      document.head.appendChild(messagePins114Css);

      const typingCss = document.createElement('link');
      typingCss.rel = 'stylesheet';
      typingCss.href = `/typing.css${buildSuffix}`;
      document.head.appendChild(typingCss);

      const voiceCss = document.createElement('link');
      voiceCss.rel = 'stylesheet';
      voiceCss.href = `/voice.css${buildSuffix}`;
      document.head.appendChild(voiceCss);

      const voicePolishCss = document.createElement('link');
      voicePolishCss.rel = 'stylesheet';
      voicePolishCss.href = `/voice-polish123.css${buildSuffix}`;
      document.head.appendChild(voicePolishCss);

      const voicePins127Css = document.createElement('link');
      voicePins127Css.rel = 'stylesheet';
      voicePins127Css.href = `/voice-pins127.css${buildSuffix}`;
      document.head.appendChild(voicePins127Css);

      // Fetch the critical chain after CSS hints; optional feature downloads
      // keep their existing onload chains instead of competing at startup.
      for(const name of preload174){
        const hint=document.createElement('link');hint.rel='preload';hint.as='script';hint.href=`/${name}${buildSuffix}`;
        document.head.appendChild(hint);
      }

      const loadApp = () => {
        const work = document.createElement('script');
        work.src = `/work174.js${buildSuffix}`;
        work.onload = loadHistoryThenApp;
        work.onerror = () => {
          // Preserve a functioning client if the optional scheduler asset fails.
          window.FPWork174 = {each: async (items, visit, {current=()=>true}={}) => {
            for(let i=0;i<items.length;i++){if(!current())return false;await visit(items[i],i);}
            return current();
          }};
          loadHistoryThenApp();
        };
        document.body.appendChild(work);
      };
      const loadHistoryThenApp = () => {
        const history = document.createElement('script');
        history.src = `/history174.js${buildSuffix}`;
        history.onload = loadContextThenApp174;
        history.onerror = loadContextThenApp174;
        document.body.appendChild(history);
      };
      const loadContextThenApp174 = () => {
        const context=document.createElement('script');
        context.src=`/room-context170.js${buildSuffix}`;context.dataset.fpRoomContext170='1';
        context.onload=()=>{
          const lifecycle=document.createElement('script');
          lifecycle.src=`/lifecycle170.js${buildSuffix}`;lifecycle.dataset.fpLifecycle170='1';
          lifecycle.onload=loadAppAfterWork;
          lifecycle.onerror=()=>{FPStartup174.fail();loadAppAfterWork();};
          document.body.appendChild(lifecycle);
        };
        context.onerror=()=>{FPStartup174.fail();loadAppAfterWork();};
        document.body.appendChild(context);
      };
      const loadAppAfterWork = async () => {
        await replyVisualReady184;
        // Build 186.3: fetch the known late-owner chain while app.js starts.
        // These hints never execute code; existing onload edges keep ownership
        // and failure handling in room-context170 / text-send170 unchanged.
        for (const name of ['connection170.js','sync-coordinator176.js','room-open170.js','send-manager177.js','text-send170.js','media-send170.js']) {
          const hint = document.createElement('link');

        const script = document.createElement('script');
        script.src = `/app.js${buildSuffix}`;
        script.defer = true;

          const chatFix = document.createElement('script');

          const loadContextStack = () => {

      // Build 173 owners load before app.js. This is dependency wiring, not
